[package]
name = "pixglyph"
version = "0.6.1"
authors = ["Laurenz <laurmaedje@gmail.com>"]
edition = "2021"
description = "Font-rendering with subpixel positioning."
repository = "https://github.com/typst/pixglyph"
readme = "README.md"
license = "Apache-2.0"
categories = ["rendering"]
keywords = ["rendering", "font"]
exclude = ["fonts/*"]

[dependencies]
skrifa = { git = "https://github.com/googlefonts/fontations", rev = "9a4f247", default-features = false, features = ["std"] }

[dev-dependencies]
iai = { git = "https://github.com/reknih/iai" }

[[bench]]
name = "oneshot"
path = "benches/oneshot.rs"
harness = false
